<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Free Foundation Scan{% endblock %} — Pheonix Digital</title>
<meta name="robots" content="{% block robots %}index, follow{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/brand.css">
</head>
<body>
<nav>
  <img src="/static/logo.png" alt="Pheonix Digital">
  {% block nav_meta %}{% endblock %}
</nav>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<footer>{% block footer %}© Pheonix Digital — Rise above the rest.{% endblock %}</footer>
</body>
</html>
